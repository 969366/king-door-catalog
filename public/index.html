<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>KING DOOR - Premium Collection</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background-color: #000; color: #fff; font-family: 'Helvetica Neue', Arial, sans-serif; overflow: hidden; }
        
        /* 导航条：毛玻璃质感 */
        .top-nav { 
            display: flex; justify-content: flex-start; align-items: center; gap: 25px; 
            height: 70px; padding: 0 20px; padding-top: env(safe-area-inset-top); 
            background: rgba(0,0,0,0.2); backdrop-filter: blur(30px);
            z-index: 100; position: fixed; top: 0; width: 100%; 
            overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .top-nav::-webkit-scrollbar { display: none; }
        .nav-item { color: rgba(255,255,255,0.4); font-size: 13px; font-weight: 600; white-space: nowrap; text-transform: uppercase; cursor: pointer; transition: 0.3s; }
        .nav-item.active { color: #D4AF37; }

        .swiper { width: 100%; height: 100vh; }
        .swiper-slide { position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; overflow: hidden; }

        /* 核心：拉伸+平铺+虚化的背景层 */
        .bg-stretch-ambient {
            position: absolute; top: -10%; left: -10%; width: 120%; height: 120%;
            z-index: 1; overflow: hidden;
        }
        .bg-stretch-ambient img { 
            width: 100%; height: 100%; 
            object-fit: cover; /* 强制平铺 */
            transform: scale(1.5); /* 强制拉伸以消除白边 */
            filter: blur(100px) brightness(0.7) saturate(140%); /* 深度虚化 */
            transition: opacity 0.8s ease;
        }

        /* 主体展示区：让 800x800 图片自然悬浮 */
        .image-box { position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; z-index: 10; cursor: pointer; }
        .image-box img { 
            position: absolute; 
            max-width: 92%; 
            max-height: 78%; 
            object-fit: contain; 
            transition: all 0.5s ease;
            filter: drop-shadow(0 20px 40px rgba(0,0,0,0.4)); /* 增加深邃投影 */
        }
        .img-pure { z-index: 12; opacity: 1; }
        .img-effect { z-index: 11; opacity: 0; }
        .image-box.show-effect .img-pure { opacity: 0; }
        .image-box.show-effect .img-effect { opacity: 1; }

        .product-id { 
            position: absolute; bottom: 145px; left: 30px; 
            color: rgba(255,255,255,0.3); font-size: 16px; font-weight: 800; 
            letter-spacing: 3px; z-index: 20;
        }

        .bottom-panel { 
            position: absolute; bottom: 0; width: 100%; 
            padding: 20px 25px 65px; padding-bottom: calc(65px + env(safe-area-inset-bottom)); 
            z-index: 30; display: flex; justify-content: flex-end; pointer-events: none;
        }
        .icon-actions { display: flex; gap: 12px; pointer-events: auto; }
        .icon-btn { 
            width: 44px; height: 44px; border-radius: 50%; 
            background: rgba(255,255,255,0.15); display: flex; justify-content: center; align-items: center; 
            backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.15);
        }
        .icon-btn svg { width: 18px; height: 18px; fill: #fff; }

        .company-footer { position: fixed; bottom: 15px; width: 100%; text-align: center; color: rgba(255,255,255,0.2); font-size: 8px; z-index: 5; letter-spacing: 1px; }
    </style>
</head>
<body>

    <div class="top-nav">
        <div class="nav-item active" onclick="changeCat('aluminum-door', 0)">Aluminum Door</div>
        <div class="nav-item" onclick="changeCat('pivot', 1)">Pivot</div>
        <div class="nav-item" onclick="changeCat('driveway-gate', 2)">Driveway Gate</div>
        <div class="nav-item" onclick="changeCat('pergola', 3)">Pergola</div>
    </div>

    <div class="swiper mySwiper">
        <div class="swiper-wrapper" id="mainWrapper"></div>
    </div>

    <div class="company-footer">@copyright Zhejiang Kaihua Door Co. Ltd.</div>

    <script src="data.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

    <script>
        const config = { phone: "008613857920335", whatsapp: "8613857920335", wechat: "13857920335", email: "khdoor@126.com" };
        let swiper = null;

        function renderGallery(cat) {
            const wrapper = document.getElementById('mainWrapper');
            const items = productData[cat] || [];
            wrapper.innerHTML = items.map(item => `
                <div class="swiper-slide">
                    <div class="bg-stretch-ambient"><img src="${item.pure}" id="bg-${item.id.replace(/\s+/g, '')}"></div>
                    <div class="product-id">MODEL: ${item.id}</div>
                    <div class="image-box" onclick="toggleEffect(this, '${item.id.replace(/\s+/g, '')}')">
                        <img src="${item.pure}" class="img-pure" loading="lazy">
                        <img src="${item.effect}" class="img-effect" loading="lazy">
                    </div>
                    <div class="bottom-panel">
                        <div class="icon-actions">
                            <a href="tel:${config.phone}" class="icon-btn"><svg viewBox="0 0 24 24"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg></a>
                            <a href="https://wa.me/${config.whatsapp}" target="_blank" class="icon-btn"><svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51a12.8 12.8 0 0 0-.57-.01c-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 0 1-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 0 1-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 0 1 2.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0 0 12.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 0 0 5.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 0 0-3.48-8.413Z"/></svg></a>
                            <div onclick="alert('WeChat ID: ' + config.wechat)" class="icon-btn"><svg viewBox="0 0 24 24"><path d="M8.5 14.5c-3.8 0-7-2.6-7-5.8s3.2-5.8 7-5.8 7 2.6 7 5.8-3.2 5.8-7 5.8c-.8 0-1.6-.1-2.3-.4l-2.4 1.2.6-2.2c-1.7-1.1-2.9-2.7-2.9-4.4zm1.5-6.5c-.4 0-.8.3-.8.8s.4.8.8.8.8-.3.8-.8-.4-.8-.8-.8zm-3 0c-.4 0-.8.3-.8.8s.4.8.8.8.8-.3.8-.8-.4-.8-.8-.8zm15.5 8c0 3.2-3.4 5.8-7.5 5.8-.8 0-1.6-.2-2.4-.5l-2.6 1.3.7-2.4c-1.8-1.2-3.1-2.8-3.1-4.7 0-3.2 3.4-5.8 7.5-5.8s7.5 2.6 7.5 5.8zm-4.5-1.5c.4 0 .8-.3.8-.8s-.4-.8-.8-.8-.8.3-.8.8.4.8.8.8zm-3 0c.4 0 .8-.3.8-.8s-.4-.8-.8-.8-.8.3-.8.8.4.8.8.8z"/></svg></div>
                            <a href="mailto:${config.email}" class="icon-btn"><svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg></a>
                        </div>
                    </div>
                </div>
            `).join('');
            
            if(swiper) swiper.destroy();
            swiper = new Swiper(".mySwiper", { direction: "horizontal", mousewheel: true, grabCursor: true });
        }

        function toggleEffect(el, bgId) {
            el.classList.toggle('show-effect');
            const bgImg = document.getElementById('bg-' + bgId);
            const isEffect = el.classList.contains('show-effect');
            bgImg.src = isEffect ? el.querySelector('.img-effect').src : el.querySelector('.img-pure').src;
        }

        function changeCat(cat, index) {
            document.querySelectorAll('.nav-item').forEach((el, i) => el.classList.toggle('active', i === index));
            renderGallery(cat);
        }

        window.onload = () => renderGallery('aluminum-door');
    </script>
</body>
</html>
