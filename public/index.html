<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>KING DOOR - Premium Collection</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        /* 核心：将背景设为与您图片一致的颜色 (如白色或极浅灰) */
        body { background-color: #f7f7f7; color: #333; font-family: 'Helvetica Neue', Arial, sans-serif; overflow: hidden; }
        
        .top-nav { 
            display: flex; justify-content: flex-start; align-items: center; gap: 30px; 
            height: 70px; padding: 0 25px; padding-top: env(safe-area-inset-top); 
            background: rgba(247,247,247,0.9); backdrop-filter: blur(10px);
            z-index: 100; position: fixed; top: 0; width: 100%; 
            overflow-x: auto; scrollbar-width: none; 
        }
        .top-nav::-webkit-scrollbar { display: none; }
        .nav-item { 
            color: #bbb; font-size: 12px; font-weight: 600; letter-spacing: 1px; 
            white-space: nowrap; flex-shrink: 0; text-transform: uppercase; cursor: pointer;
        }
        .nav-item.active { color: #D4AF37; }

        /* Swiper 容器：支持全向滑动 */
        .swiper-v { width: 100%; height: 100vh; } /* 纵向：切换品类 */
        .swiper-h { width: 100%; height: 100%; } /* 横向：切换产品 */

        .image-container { 
            position: relative; width: 100%; height: 100%; 
            display: flex; align-items: center; justify-content: center;
        }
        .image-container img { 
            max-width: 100%; max-height: 80%; 
            object-fit: contain; 
            transition: opacity 0.5s ease;
        }
        .img-pure { opacity: 1; z-index: 2; }
        .img-effect { opacity: 0; z-index: 1; }
        .image-container.show-effect .img-pure { opacity: 0; }
        .image-container.show-effect .img-effect { opacity: 1; }

        /* 产品ID：半透明融合 */
        .product-id { 
            position: absolute; bottom: 130px; left: 25px; 
            color: rgba(0,0,0,0.15); font-size: 16px; font-weight: bold; 
            letter-spacing: 3px; z-index: 5; 
        }

        .bottom-panel { 
            position: absolute; bottom: 0; width: 100%; 
            padding: 20px 25px 50px; 
            padding-bottom: calc(50px + env(safe-area-inset-bottom)); 
            z-index: 10; display: flex; justify-content: flex-end; pointer-events: none;
        }
        .icon-actions { display: flex; gap: 20px; pointer-events: auto; }
        .icon-btn { 
            width: 44px; height: 44px; border-radius: 50%; 
            background: rgba(0,0,0,0.03); display: flex; 
            justify-content: center; align-items: center; text-decoration: none;
        }
        .icon-btn svg { width: 20px; height: 20px; fill: #666; }

        .company-footer { 
            position: fixed; bottom: 15px; width: 100%; 
            text-align: center; color: #ddd; font-size: 9px; z-index: 5; 
        }
    </style>
</head>
<body>

    <div class="top-nav">
        <div class="nav-item active" data-cat="aluminum-door">Aluminum Door</div>
        <div class="nav-item" data-cat="pivot">Pivot</div>
        <div class="nav-item" data-cat="driveway-gate">Driveway Gate</div>
        <div class="nav-item" data-cat="pergola">Pergola</div>
    </div>

    <div class="swiper swiper-v">
        <div class="swiper-wrapper" id="main-wrapper">
            <!-- 动态生成纵向和横向滑动内容 -->
        </div>
    </div>

    <div class="company-footer">&copy; Zhejiang Kaihua Door Co. Ltd.</div>

    <script src="data.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

    <script>
        const config = { phone: "008613857920335", whatsapp: "8613857920335", email: "khdoor@126.com" };

        function initCatalog() {
            const mainWrapper = document.getElementById('main-wrapper');
            const categories = ['aluminum-door', 'pivot', 'driveway-gate', 'pergola'];

            categories.forEach(cat => {
                const items = productData[cat] || [];
                let slidesHtml = '';
                
                items.forEach(item => {
                    const waLink = `https://api.whatsapp.com/send?phone=${config.whatsapp}&text=${encodeURIComponent('Interest: ' + item.id)}`;
                    slidesHtml += `

                            <div class="product-id">${item.id}</div>
                            <div class="image-container" onclick="this.classList.toggle('show-effect')">
                                <img src="${item.pure}" class="img-pure">
                                <img src="${item.effect}" class="img-effect">
                            </div>
                            <div class="bottom-panel">

                                    <div onclick="alert('ID: 13857920335')" class="icon-btn"><svg viewBox="0 0 24 24"><path d="M8.5 14.5c-3.8 0-7-2.6-7-5.8s3.2-5.8 7-5.8 7 2.6 7 5.8-3.2 5.8-7 5.8c-.8 0-1.6-.1-2.3-.4l-2.4 1.2.6-2.2c-1.7-1.1-2.9-2.7-2.9-4.4zm1.5-6.5c-.4 0-.8.3-.8.8s.4.8.8.8.8-.3.8-.8-.4-.8-.8-.8zm-3 0c-.4 0-.8.3-.8.8s.4.8.8.8.8-.3.8-.8-.4-.8-.8-.8zm15.5 8c0 3.2-3.4 5.8-7.5 5.8-.8 0-1.6-.2-2.4-.5l-2.6 1.3.7-2.4c-1.8-1.2-3.1-2.8-3.1-4.7 0-3.2 3.4-5.8 7.5-5.8s7.5 2.6 7.5 5.8zm-4.5-1.5c.4 0 .8-.3.8-.8s-.4-.8-.8-.8-.8.3-.8.8.4.8.8.8zm-3 0c.4 0 .8-.3.8-.8s-.4-.8-.8-.8-.8.3-.8.8.4.8.8.8z"/></svg></div>
                                    <a href="mailto:${config.email}" class="icon-btn"><svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg></a>
                                </div>
                            </div>
                        </div>`;
                });

                mainWrapper.innerHTML += `
                    <div class="swiper-slide">
                        <div class="swiper swiper-h" id="h-${cat}">
                            <div class="swiper-wrapper">${slidesHtml || '<div class="swiper-slide" style="display:flex;align-items:center;justify-content:center;color:#ccc;">COMING SOON</div>'}</div>
                        </div>
                    </div>`;
            });

            const swiperV = new Swiper(".swiper-v", { direction: "vertical", mousewheel: true, speed: 600 });
            const hSwipers = categories.map(cat => new Swiper(`#h-${cat}`, { direction: "horizontal", mousewheel: true, speed: 600 }));

            // 联动导航栏
            swiperV.on('slideChange', () => {
                document.querySelectorAll('.nav-item').forEach((el, i) => {
                    el.classList.toggle('active', i === swiperV.activeIndex);
                });
            });

            document.querySelectorAll('.nav-item').forEach((el, i) => {
                el.onclick = () => swiperV.slideTo(i);
            });
        }

        window.onload = initCatalog;
    </script>
</body>
</html>
